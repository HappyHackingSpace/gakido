name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Get version and create tag
        id: version
        run: |
          # Extract current version from pyproject.toml
          VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Version: $VERSION"

          NEW_TAG="v${VERSION}"

          # Check if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Creating tag: $NEW_TAG"

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag only
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          # Set outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install build tools
        if: steps.version.outputs.skip != 'true'
        run: pip install build

      - name: Build sdist and wheel
        if: steps.version.outputs.skip != 'true'
        # gakido is pure Python, so a single source distribution and one
        # py3-none-any wheel cover every platform and Python version.
        run: python -m build --outdir final_dist

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          files: final_dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.version.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: final_dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
