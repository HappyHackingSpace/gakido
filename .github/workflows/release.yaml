name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.22.12"

jobs:
  # Pure-Python source distribution. Installs as a fallback on any platform we
  # do not ship a native wheel for (e.g. Windows): the native backend is simply
  # absent and gakido uses the stdlib TLS path.
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build
      - run: python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Linux x86_64 wheel with the native library bundled. cibuildwheel runs the
  # build inside a manylinux container and repairs the wheel (auditwheel), so
  # the result is PyPI-compatible. Go is installed in CIBW_BEFORE_ALL and builds
  # the shared library; the wheel build then bundles it. The library is loaded
  # via ctypes and is Python-version independent, so a single cp311 build
  # produces one py3-none-manylinux wheel that serves all supported versions.
  build_wheels_linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BEFORE_ALL: >
            curl -fsSL https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz -o /tmp/go.tgz &&
            tar -C /usr/local -xzf /tmp/go.tgz &&
            export PATH=$PATH:/usr/local/go/bin &&
            make -C native build
          CIBW_ENVIRONMENT: "GO_VERSION=${{ env.GO_VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: wheelhouse/*.whl

  # macOS wheels (arm64 on macos-14, x86_64), each with the native
  # library built natively for that architecture.
  build_wheels_macos:
    name: Build macOS wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build native library
        run: make -C native build
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Tag, release and publish — only after every build has succeeded, so a
  # failed platform never leaves a half-published release.
  publish:
    name: Tag, GitHub Release and PyPI
    needs: [build_sdist, build_wheels_linux, build_wheels_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: final_dist
          merge-multiple: true

      - name: Get version and create tag
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Version: $VERSION"
          NEW_TAG="v${VERSION}"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: List artifacts
        if: steps.version.outputs.skip != 'true'
        run: ls -la final_dist/

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          files: final_dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.version.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: final_dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
